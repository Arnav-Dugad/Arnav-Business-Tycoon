# Resource limits: keep builds from saturating the developer's laptop (owner request, 2026-11-06).
# At most 4 parallel workers; modest heaps; daemons exit after 10 idle minutes.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:ParallelGCThreads=2
org.gradle.workers.max=4
org.gradle.daemon.idletimeout=600000
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.daemon.jvmargs=-Xmx1g -XX:ParallelGCThreads=2
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Signing credentials are NEVER stored here. They live in ~/.gradle/gradle.properties (outside the repo).
